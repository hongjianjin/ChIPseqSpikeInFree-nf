name: Build ChIPseqSpikeInFree-bigwig container

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "tag of ghcr.io/<owner>/chipseqspikeinfree-bigwig to publish"
        default: "0.1.0"
      base_image:
        description: "ChIPseqSpikeInFree image to extend"
        default: "ghcr.io/hongjianjin/chipseqspikeinfree:1.2.6"
  push:
    branches: [main]
    paths:
      - "containers/chipseqspikeinfree-bigwig/**"
      - ".github/workflows/build-container.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.inputs.image_tag || '0.1.0' }}
      BASE: ${{ github.event.inputs.base_image || 'ghcr.io/hongjianjin/chipseqspikeinfree:1.2.6' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: containers/chipseqspikeinfree-bigwig
          build-args: BASE=${{ env.BASE }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chipseqspikeinfree-bigwig:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/chipseqspikeinfree-bigwig:${{ env.TAG }} \
            python3 -c "import pybigtools, numpy, requests; print('pybigtools', pybigtools.__file__)"
          docker run --rm ghcr.io/${{ github.repository_owner }}/chipseqspikeinfree-bigwig:${{ env.TAG }} \
            Rscript -e 'library(ChIPseqSpikeInFree); stopifnot(file.exists(system.file("scripts/run_ChIPseqSpikeInFree.R", package = "ChIPseqSpikeInFree")))'
