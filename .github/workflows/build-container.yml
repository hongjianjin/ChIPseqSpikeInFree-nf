name: Build ChIPseqSpikeInFree container

on:
  workflow_dispatch:
    inputs:
      csif_ref:
        description: "stjude/ChIPseqSpikeInFree git tag to install"
        default: "1.2.6"
  push:
    branches: [main]
    paths:
      - "containers/chipseqspikeinfree/**"
      - ".github/workflows/build-container.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REF: ${{ github.event.inputs.csif_ref || '1.2.6' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: echo "TAG=${REF#v}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: containers/chipseqspikeinfree
          build-args: CSIF_REF=${{ env.REF }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chipseqspikeinfree:${{ env.TAG }}
            ghcr.io/${{ github.repository_owner }}/chipseqspikeinfree:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
